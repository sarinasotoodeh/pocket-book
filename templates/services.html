<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Spots</title>
    <link rel="stylesheet" href="../static/services.css">
</head>
<body>
    {% for vendor in vendors %}
<div class="location-group" id="{{ vendor.location_id }}">
    <h2>{{ vendor.name }}</h2>

    <div class="vendor-card">
        <header>
            <h3>{{ vendor.name }}</h3>
            <span class="place-tag">{{ vendor.place_tag }}</span>
        </header>

        <table class="hours-table">
            {% for entry in vendor.hours %}
            <tr>
                <th>{{ entry.day }}</th>
                <td>{{ entry.start_time }} - {{ entry.end_time }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>
{% endfor %}

    <p class="note">© 2026 UTSC Food & Beverages.</p>
</body>
</html>
