<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../static/accounts.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <header>
        <a href="#"><img class="logo" src="../static/images/logo.png" alt="Logo"></a>
    </header>
    <main>
        <section class="banner"></section>
        <section class="container">
            <div class="form-box">
                <h2>Create Account</h2>
                <form action="/signup" method="POST">
                    <input type="text" name="fullname" placeholder="Full Name" required>
                    <input type="email" name="email" placeholder="UTSC Email" required>
                    <input type="text" name="student_number" placeholder="Student Number" required>
                    <input type="text" name="username" placeholder="UTORid" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit">Sign Up</button>
                </form>
                <p class="link-text">Already have an account? <a href="/login">Log In</a></p>
            </div>
        </section>
        <section class="banner"></section>
    </main>
</body>

<script src="../static/accounts.js"></script>

</html>
