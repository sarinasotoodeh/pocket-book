<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="../static/accounts.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <a href="#"><img class="logo" src="../static/images/logo.png" alt="Logo"></a>
    </header>
    <main>
        <section class="banner"></section>
        
        <section class="container">
            <div class="form-box">
                <h2>Login</h2>
                <form action="/login" method="POST">
                    <input type="text" name="username" placeholder="UTORid or Username" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit">Sign In</button>
                </form>
                <p class="link-text">Don't have an account? <a href="/signup">Sign Up</a></p>
            </div>
        </section>

        <section class="banner"></section>
    </main>
</body>
<script src="../static/accounts.js"></script>

</html>
